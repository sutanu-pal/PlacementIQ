# ─────────────────────────────────────────────────────────────
# PlacementIQ — Docker Compose (Development)
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    container_name: placementiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: placementiq
      POSTGRES_PASSWORD: placementiq
      POSTGRES_DB: placementiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placementiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placementiq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://placementiq:placementiq@db:5432/placementiq
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads
      - backend-models:/app/models_cache
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placementiq-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  backend-uploads:
  backend-models:
